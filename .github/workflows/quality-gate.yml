name: Quality Gate (Lint)

# Spec Kitの /speckit.implement 実行後、AIエージェントが生成・変更した
# コードに対してLintを強制するためのサンプルCI。
# 言語別のLintコマンドは組織のpreset（docs/guides/lint-preset-guide.md参照）に合わせて置き換える。
#
# 現時点で自動対応しているのは Node.js/TypeScript・Python・Java（Maven/Gradle）の3例。
# 他言語のプロジェクトでは、下記と同じ形式（hashFilesで判定 →
# Setup → Lint実行）でブロックを追加し、あわせて最終ステップ
# 「Verify a Lint stack was detected」のif条件にもその言語の判定ファイルを
# 追記すること（追記しないと、その言語のプロジェクトはLintが一つも走らない
# ままジョブが緑になってしまう）。
#
# 本プロジェクト（003-bookstore-purchase-flow）はルートに package.json を置かず
# frontend/ と backend/ に分離しているため、Node.js ブロックを
#   (1) ルート package.json（他プロジェクト互換のため残置）
#   (2) frontend/package.json
#   (3) backend/package.json
# の3系統に分け、それぞれ working-directory で ESLint を実行する。
# フェイルセーフの if 条件にも frontend/backend の package.json を追加済み。

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 例1: Node.js / TypeScript プロジェクトの場合 ---
      # setup-node は一度実行すれば足りる（いずれかの package.json があれば Node をセットアップ）
      - name: Setup Node.js
        if: >
          hashFiles('package.json') != '' ||
          hashFiles('frontend/package.json') != '' ||
          hashFiles('backend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # (1) ルート package.json（他プロジェクト互換のため残置。本プロジェクトでは通常ヒットしない）
      - name: Install & Run ESLint (root)
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run lint

      # (2) frontend/
      - name: Install & Run ESLint (frontend)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      # (3) backend/
      - name: Install & Run ESLint (backend)
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: |
          npm ci
          npm run lint

      # --- 例2: Python プロジェクトの場合 ---
      - name: Setup Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install & Run Ruff
        if: hashFiles('pyproject.toml') != ''
        run: |
          pip install ruff
          ruff check .

      # --- 例3: Java プロジェクトの場合（Maven または Gradle） ---
      - name: Setup Java
        if: hashFiles('pom.xml') != '' || hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run Checkstyle (Maven)
        if: hashFiles('pom.xml') != ''
        run: mvn --batch-mode checkstyle:check

      - name: Run Checkstyle (Gradle)
        if: hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != ''
        run: ./gradlew checkstyleMain checkstyleTest

      # --- フェイルセーフ: どの言語ブロックにも該当しなかった場合は明示的に失敗させる ---
      # (上記いずれのLintも実行されていない = このプロジェクトの言語がまだ
      #  quality-gate.ymlに未対応、という設定不足を「サイレントな緑」ではなく
      #  明示的な赤として検出する。コードのLintエラー自体は各言語のLintステップ
      #  が既に失敗させるため、ここでは扱わない)
      - name: Verify a Lint stack was detected
        if: >
          hashFiles('package.json') == '' &&
          hashFiles('frontend/package.json') == '' &&
          hashFiles('backend/package.json') == '' &&
          hashFiles('pyproject.toml') == '' &&
          hashFiles('pom.xml') == '' &&
          hashFiles('build.gradle') == '' &&
          hashFiles('build.gradle.kts') == ''
        run: |
          echo "::error::このプロジェクトの言語に対応するLintブロックがquality-gate.ymlに定義されていません。"
          echo "::error::docs/guides/lint-preset-guide.md を参照し、該当する言語のLintブロックを追加してください。"
          exit 1
